# Anuvad Software Solutions — static SPA on the Hostinger VPS
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/anuvadsoftware
#   sudo ln -s /etc/nginx/sites-available/anuvadsoftware /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d anuvadsoftware.com -d www.anuvadsoftware.com
#
# Note: anuvadsoftware.com currently uses Wix nameservers. Point the domain's
# nameservers (or at minimum its A record) at the VPS before running certbot,
# or the ACME challenge will fail.

server {
    listen 80;
    listen [::]:80;
    server_name anuvadsoftware.com www.anuvadsoftware.com;

    root /var/www/anuvadsoftware;
    index index.html;

    # Vite fingerprints its assets, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: every unknown path is served by the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 8M;
}

# --- Subdomains --------------------------------------------------------------
